name: Build IG

on:
  push:
    branches:
      - main
      - master
      - staging
  pull_request:
    branches:
      - main
      - master
      - staging
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

env:
  JAVA_TOOL_OPTIONS: "-Xmx6g -Dfile.encoding=UTF-8"
  PUBLISHER_REPO: glichtner/fhir-ig-publisher
  SUSHI_VERSION: "3.20.0"

jobs:
  build-ig:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll
        run: gem install bundler jekyll

      - name: Install SUSHI
        run: npm install -g "fsh-sushi@${SUSHI_VERSION}"

      # Seeds hl7.fhir.r6.core/expansions#6.0.0-ballot5 from hl7.org (ballot5
      # is not on the package registries yet) and fixes the packages' web
      # location and materialized extension slicing; see script for details.
      - name: Install FHIR R6 ballot5 packages into local FHIR cache
        run: ./download-fhir-r6-ballot5.sh

      - name: Download latest glichtner IG Publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p input-cache

          auth_header=()
          if [ -n "${GH_RELEASE_TOKEN:-}" ]; then
            auth_header=(-H "Authorization: Bearer ${GH_RELEASE_TOKEN}")
          elif [ -n "${GITHUB_TOKEN:-}" ]; then
            auth_header=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          fi

          releases_json="$(curl -fsSL "${auth_header[@]}" "https://api.github.com/repos/${PUBLISHER_REPO}/releases?per_page=20")"
          if jq -e 'type != "array"' <<< "$releases_json" >/dev/null; then
            echo "GitHub API did not return a release list for ${PUBLISHER_REPO}:"
            jq -r '.message // .' <<< "$releases_json"
            exit 1
          fi

          asset_url="$(jq -r '[.[] | select(.draft | not) | .assets[]? | select(.name == "publisher.jar" or (.name | test("publisher.*\\.jar$")))] | .[0].browser_download_url // ""' <<< "$releases_json")"

          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "Could not find publisher.jar in any non-draft ${PUBLISHER_REPO} release."
            exit 1
          fi

          echo "Downloading publisher from $asset_url"
          curl -fL "${auth_header[@]}" "$asset_url" -o input-cache/publisher.jar

      - name: Run SUSHI
        run: sushi .

      - name: Run IG Publisher
        run: java -jar input-cache/publisher.jar -ig . -no-sushi

      - name: QA baseline check (warn-only)
        run: ./check-qa-baseline.sh

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ebm-incubator-ig-output
          path: output

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebm-incubator-package
          path: output/package.tgz
          if-no-files-found: error

      - name: Upload package to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: output/package.tgz

      # Durable copy of the latest package: workflow artifacts expire after
      # ~90 days, which would break downstream builds (ebm, awmf-ig) whenever
      # this repo has been quiet for a while. Marked prerelease so it never
      # becomes the repo's "latest" release.
      - name: Update rolling ci-build release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build
          name: Rolling CI build package
          prerelease: true
          make_latest: false
          body: |
            Latest hl7.fhir.uv.ebm-incubator package.tgz, updated on every push
            to the default branch. Built from ${{ github.sha }}.
          files: output/package.tgz

      # Trigger the downstream ebm build (cross-repo workflow_dispatch).
      # Requires a PAT with actions:write on glichtner/ebm stored as the
      # GH_RELEASE_TOKEN secret; skipped gracefully while it is absent.
      - name: Trigger downstream ebm build
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          DISPATCH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::notice::GH_RELEASE_TOKEN not set - skipping downstream dispatch (glichtner/ebm)."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/glichtner/ebm/actions/workflows/build-ig.yml/dispatches \
            -d '{"ref":"master"}' \
            && echo "Dispatched glichtner/ebm build-ig.yml (master)" \
            || echo "::warning::Downstream dispatch to glichtner/ebm failed (check GH_RELEASE_TOKEN scope: actions:write)"
